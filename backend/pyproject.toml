[project]
name = "optiserve"
version = "0.1.0"
description = "OptiServe 智能客服后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "langchain-deepseek>=1.1.0",
    "langfuse>=3,<4",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pymilvus>=2.6,<3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
